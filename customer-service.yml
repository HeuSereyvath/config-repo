server:
  port: 6666

spring:
  application:
    name: customer-service

# local postgres desktop
  r2dbc:
    url: r2dbc:postgresql://host.docker.internal:5432/customer_service
    username: postgres
    password: postgres

  liquibase:
    enabled: true
    url: jdbc:postgresql://host.docker.internal:5432/customer_service
    user: postgres
    password: postgres
    change-log: classpath:/db/changelog/db.changelog-master.yaml

logging:
  level:
    root: INFO
    org.springframework.r2dbc: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:9000/eureka

#jwt:
#  secret: dev-secret-key-change-me
#  encryptionKey: dev-encryption-key-change-me

jwt:
  secret: dev-secret-key-change-me
  encryptionKey: dev-encryption-key-change-me
  keys:
    client2BackPublicKey: dummy-public-key-value
    back2BackKey: dummy-back-to-back-key-value

management:
  endpoints:
    web:
      exposure:
        include: "*"


