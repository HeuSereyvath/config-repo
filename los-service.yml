server:
  port: 7777

spring:
  application:
    name: los-service

  r2dbc:
    url: r2dbc:postgresql://host.docker.internal:5432/los_service
    username: postgres
    password: postgres

  liquibase:
    enabled: true
    url: jdbc:postgresql://host.docker.internal:5432/los_service
    user: postgres
    password: postgres
    change-log: classpath:/db/changelog/master.xml

jwt:
  secret: dev-secret-key-change-me
  encryptionKey: dev-encryption-key-change-me

logging:
  level:
    root: INFO
    org.springframework.r2dbc: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:9000/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

